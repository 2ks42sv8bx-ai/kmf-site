<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Admin · vandenHove</title>
<link rel="preload" href="../fonts/inter.woff2" as="font" type="font/woff2" crossorigin>
<script>
try { if (localStorage.getItem('vandenhove-token')) document.documentElement.classList.add('connected'); } catch {}
history.scrollRestoration = 'manual';
</script>
<link rel="stylesheet" href="../styles.css?v=20261101d">
</head>
<body>
<header class="top">
  <nav aria-label="Main">
    <a href="../" data-connected>Reading</a>
    <a href="../install/">Install</a>
  </nav>
</header>
<main class="page">
  <h1>Admin</h1>
  <form class="card stack admin-form" id="unlock">
    <label>Admin secret <input name="secret" type="password" autocomplete="off" required></label>
    <button class="primary" type="submit">Open</button>
    <p class="problem" role="alert"></p>
  </form>
  <div id="panel" hidden>
    <p class="problem" id="problem" role="alert"></p>

    <h2>Invites</h2>
    <p><button class="primary" type="button" id="new-invite">New invite</button></p>
    <ul class="admin-list" id="invites"></ul>

    <h2>Groups</h2>
    <form class="card stack admin-form" id="new-group">
      <label>Group's name <input name="name" maxlength="60" required></label>
      <label>First member's name <input name="member_name" maxlength="60" required></label>
      <label>First member's account <select name="account" id="accounts" required></select></label>
      <button class="primary" type="submit">Create</button>
      <p class="problem" role="alert"></p>
    </form>
    <div id="groups"></div>

    <h2>People</h2>
    <ul class="admin-list" id="people"></ul>
  </div>
</main>
<script type="module" src="admin.js?v=20261101d"></script>
</body>
</html>
