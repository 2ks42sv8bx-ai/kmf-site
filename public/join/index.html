<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Join a group · vandenHove</title>
<link rel="stylesheet" href="../styles.css">
</head>
<body>
<header class="top">
  <a class="brand" href="../">vandenHove</a>
  <nav aria-label="Main">
    <a href="../setup/">Setup</a>
    <a href="../groups/" aria-current="page">Groups</a>
  </nav>
</header>
<main class="page narrow">
  <h1 id="heading">Join a group</h1>

  <form class="card stack" id="code-form">
    <label>Group code <input name="code" autocomplete="off" autocapitalize="characters" required></label>
    <button class="primary" type="submit">Continue</button>
    <p class="problem" role="alert"></p>
  </form>

  <form class="card stack" id="name-form" hidden>
    <label>Your name in this group <input name="name" maxlength="60" autocomplete="name" required></label>
    <details id="existing">
      <summary>I already use vandenHove</summary>
      <label>Code from one of your devices <input name="device" autocomplete="off" autocapitalize="characters"></label>
    </details>
    <button class="primary" type="submit">Join</button>
    <p class="problem" role="alert"></p>
  </form>
</main>
<script type="module" src="join.js"></script>
</body>
</html>
